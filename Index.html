<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jurnal Harian - <?= CONFIG.NAMA_GURU ?></title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --warna-utama:    <?= CONFIG.WARNA_UTAMA ?>;
  --warna-gradient: <?= CONFIG.WARNA_GRADIENT ?>;
  --warna-aksen:    <?= CONFIG.WARNA_AKSEN ?>;
  --radius: 16px;
}
*{font-family:'Plus Jakarta Sans',sans-serif;}
body{background:#f5f7fb;color:#1e293b;padding-bottom:80px;}

/* HEADER */
.app-header{
  background:linear-gradient(135deg,var(--warna-utama),var(--warna-gradient));
  color:#fff;padding:22px 18px 90px;border-radius:0 0 28px 28px;
  position:relative;overflow:hidden;
}
.app-header::after{
  content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;
  background:rgba(255,255,255,.08);border-radius:50%;
}
.avatar-pen{
  width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:24px;
}
.badge-sekolah{
  background:rgba(255,255,255,.22);border-radius:50px;padding:4px 12px;
  font-size:11px;font-weight:600;display:inline-block;
}
.btn-music{
  width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.22);
  color:#fff;font-size:18px;transition:.2s;
}
.btn-music.playing{background:#fff;color:var(--warna-utama);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* CARD */
.main-card{
  background:#fff;border-radius:var(--radius);padding:20px;margin-top:-70px;
  box-shadow:0 8px 30px rgba(2,132,199,.10);
}
.section-title{
  font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  color:var(--warna-utama);margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
.section-title i{font-size:14px;}
.form-control,.form-select{border-radius:10px;border:1.5px solid #e2e8f0;padding:10px 12px;font-size:14px;}
.form-control:focus,.form-select:focus{border-color:var(--warna-utama);box-shadow:0 0 0 3px rgba(2,132,199,.12);}
.form-label{font-size:12.5px;font-weight:600;color:#475569;margin-bottom:4px;}

/* COUNTER KEHADIRAN */
.counter-card{
  border-radius:12px;padding:10px;text-align:center;border:1.5px solid #e2e8f0;
  background:#fff;transition:.2s;
}
.counter-card .label{font-size:10.5px;font-weight:700;letter-spacing:.4px;}
.counter-card .val{font-size:22px;font-weight:800;line-height:1;}
.counter-card .btn-adj{
  width:26px;height:26px;border-radius:8px;border:none;font-weight:700;
  font-size:13px;line-height:1;color:#fff;
}
.counter-card.hadir .val{color:#059669;}
.counter-card.hadir .btn-adj{background:#059669;}
.counter-card.sakit .val{color:#d97706;}
.counter-card.sakit .btn-adj{background:#d97706;}
.counter-card.izin  .val{color:#0284c7;}
.counter-card.izin  .btn-adj{background:#0284c7;}
.counter-card.alpa  .val{color:#dc2626;}
.counter-card.alpa  .btn-adj{background:#dc2626;}

.btn-save{
  background:linear-gradient(135deg,var(--warna-utama),var(--warna-gradient));
  color:#fff;border:none;border-radius:12px;padding:14px;font-weight:700;
  font-size:15px;width:100%;transition:.2s;
}
.btn-save:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(2,132,199,.35);}
.btn-save:disabled{opacity:.7;}

/* TAB SWITCH */
.nav-tabs-custom{
  display:flex;gap:6px;background:#eef2f7;border-radius:12px;padding:4px;margin-bottom:18px;
}
.nav-tabs-custom button{
  flex:1;border:none;background:transparent;padding:9px;border-radius:9px;
  font-weight:700;font-size:13px;color:#64748b;transition:.2s;
}
.nav-tabs-custom button.active{background:#fff;color:var(--warna-utama);box-shadow:0 2px 8px rgba(0,0,0,.06);}

/* REKAP TABLE */
.rekap-table{font-size:12px;}
.rekap-table th{background:#f1f5f9;font-weight:700;font-size:11px;padding:6px;white-space:nowrap;}
.rekap-table td{padding:6px;vertical-align:middle;}
.summary-box{
  background:linear-gradient(135deg,var(--warna-utama),var(--warna-gradient));
  color:#fff;border-radius:12px;padding:14px;margin-bottom:14px;
}
.summary-box .num{font-size:22px;font-weight:800;}

@media print{
  .app-header,.nav-tabs-custom,.btn-save,.btn-music,.main-card > .no-print{display:none!important;}
  .main-card{box-shadow:none;margin-top:0;padding:0;}
  body{background:#fff;}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="app-header">
  <div class="d-flex justify-content-between align-items-start">
    <div class="avatar-pen"><i class="fa-solid fa-pen-nib"></i></div>
    <button class="btn-music" id="btnMusic" onclick="toggleMusic()" title="Musik santai">
      <i class="fa-solid fa-music"></i>
    </button>
  </div>
  <div class="mt-3">
    <span class="badge-sekolah"><i class="fa-solid fa-school me-1"></i><?= CONFIG.NAMA_SEKOLAH ?></span>
    <h4 class="fw-bold mt-2 mb-1">Jurnal Harian Guru</h4>
    <div style="font-size:13px;opacity:.9;"><i class="fa-solid fa-user me-1"></i><?= CONFIG.NAMA_GURU ?></div>
  </div>
</header>

<div class="container px-3">
  <div class="main-card">
    <!-- TAB -->
    <div class="nav-tabs-custom no-print">
      <button id="tabInput" class="active" onclick="switchTab('input')">
        <i class="fa-solid fa-pen-to-square me-1"></i>Input Jurnal
      </button>
      <button id="tabRekap" onclick="switchTab('rekap')">
        <i class="fa-solid fa-chart-simple me-1"></i>Rekap & Cetak
      </button>
    </div>

    <!-- ============ PAGE: INPUT ============ -->
    <div id="pageInput">
      <div id="alertBox"></div>

      <div class="section-title"><i class="fa-solid fa-calendar-day"></i>1. Waktu & Kelas</div>
      <div class="row g-2 mb-3">
        <div class="col-6">
          <label class="form-label">Tanggal</label>
          <input type="date" id="tanggal" class="form-control">
        </div>
        <div class="col-6">
          <label class="form-label">Jam Ke-</label>
          <input type="text" id="jamKe" class="form-control" placeholder="1-2 / 3-4">
        </div>
        <div class="col-6">
          <label class="form-label">Kelas</label>
          <select id="kelas" class="form-select"></select>
        </div>
        <div class="col-6">
          <label class="form-label">Mata Pelajaran</label>
          <input type="text" id="mapel" class="form-control" value="<?= CONFIG.MATA_PELAJARAN ?>">
        </div>
      </div>

      <div class="section-title"><i class="fa-solid fa-book-open"></i>2. Materi & Pembelajaran</div>
      <div class="mb-2">
        <label class="form-label">Materi / Sub-Materi</label>
        <input type="text" id="materi" class="form-control" placeholder="Contoh: Persamaan Linear Satu Variabel">
      </div>
      <div class="mb-3">
        <label class="form-label">Kegiatan Pembelajaran</label>
        <textarea id="kegiatan" class="form-control" rows="3" placeholder="Deskripsi singkat kegiatan..."></textarea>
      </div>

      <div class="section-title"><i class="fa-solid fa-users"></i>3. Rekap Kehadiran Siswa</div>
      <div class="row g-2 mb-3">
        <div class="col-3"><div class="counter-card hadir">
          <div class="label text-success">HADIR</div>
          <div class="val" id="valHadir">0</div>
          <div class="d-flex justify-content-center gap-1 mt-2">
            <button type="button" class="btn-adj" onclick="adjustCount('hadir',-1)">−</button>
            <button type="button" class="btn-adj" onclick="adjustCount('hadir',1)">+</button>
          </div>
          <input type="hidden" id="hadir" value="0">
        </div></div>
        <div class="col-3"><div class="counter-card sakit">
          <div class="label text-warning">SAKIT</div>
          <div class="val" id="valSakit">0</div>
          <div class="d-flex justify-content-center gap-1 mt-2">
            <button type="button" class="btn-adj" onclick="adjustCount('sakit',-1)">−</button>
            <button type="button" class="btn-adj" onclick="adjustCount('sakit',1)">+</button>
          </div>
          <input type="hidden" id="sakit" value="0">
        </div></div>
        <div class="col-3"><div class="counter-card izin">
          <div class="label text-primary">IZIN</div>
          <div class="val" id="valIzin">0</div>
          <div class="d-flex justify-content-center gap-1 mt-2">
            <button type="button" class="btn-adj" onclick="adjustCount('izin',-1)">−</button>
            <button type="button" class="btn-adj" onclick="adjustCount('izin',1)">+</button>
          </div>
          <input type="hidden" id="izin" value="0">
        </div></div>
        <div class="col-3"><div class="counter-card alpa">
          <div class="label text-danger">ALPA</div>
          <div class="val" id="valAlpa">0</div>
          <div class="d-flex justify-content-center gap-1 mt-2">
            <button type="button" class="btn-adj" onclick="adjustCount('alpa',-1)">−</button>
            <button type="button" class="btn-adj" onclick="adjustCount('alpa',1)">+</button>
          </div>
          <input type="hidden" id="alpa" value="0">
        </div></div>
      </div>

      <div class="section-title"><i class="fa-solid fa-note-sticky"></i>4. Catatan / Refleksi <span class="text-muted fw-normal" style="font-size:11px;">(opsional)</span></div>
      <textarea id="catatan" class="form-control mb-3" rows="2" placeholder="Kejadian penting, refleksi, tindak lanjut..."></textarea>

      <button class="btn-save" id="btnSubmit" onclick="handleFormSubmit(event)">
        <i class="fa-solid fa-floppy-disk me-2"></i><span id="btnText">Simpan Jurnal</span>
        <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
      </button>
    </div>

    <!-- ============ PAGE: REKAP ============ -->
    <div id="pageRekap" class="d-none">
      <div class="section-title"><i class="fa-solid fa-filter"></i>Filter Rekap</div>
      <div class="row g-2 mb-3">
        <div class="col-6">
          <label class="form-label">Kelas</label>
          <select id="rekapKelas" class="form-select"></select>
        </div>
        <div class="col-6">
          <label class="form-label">Bulan</label>
          <input type="month" id="rekapBulan" class="form-control">
        </div>
      </div>
      <div class="d-flex gap-2 mb-3 no-print">
        <button class="btn-save" style="flex:1;" onclick="muatRekap()">
          <i class="fa-solid fa-magnifying-glass me-2"></i>Tampilkan
        </button>
        <button class="btn btn-outline-secondary" style="border-radius:12px;" onclick="window.print()">
          <i class="fa-solid fa-print"></i>
        </button>
      </div>

      <div id="rekapArea"></div>
    </div>
  </div>
</div>

<!-- AUDIO -->
<audio id="bgMusic" loop></audio>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const START_PAGE = '<?= START_PAGE ?>';
let APP_CONFIG = null;
let currentUser = null;

document.addEventListener('DOMContentLoaded', () => {
  // Set tanggal hari ini
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('tanggal').value = today;
  document.getElementById('rekapBulan').value = today.slice(0,7);

  // Muat info user & config
  google.script.run
    .withSuccessHandler(res => {
      APP_CONFIG = res.config;
      currentUser = res;
      isiDropdownKelas(res.config.daftarKelas);
      const music = document.getElementById('bgMusic');
      if (res.config.urlMusik) music.src = res.config.urlMusik;
      if (!res.authorized) {
        tampilkanAlert('warning', '<i class="fa-solid fa-lock me-1"></i>' + (res.message || 'Anda belum terdaftar.'));
      }
      switchTab(START_PAGE);
    })
    .getInfoUser();
});

function isiDropdownKelas(list) {
  ['kelas','rekapKelas'].forEach(id => {
    const sel = document.getElementById(id);
    sel.innerHTML = list.map(k => `<option value="${k}">${k}</option>`).join('');
  });
}

function switchTab(tab) {
  document.getElementById('pageInput').classList.toggle('d-none', tab !== 'input');
  document.getElementById('pageRekap').classList.toggle('d-none', tab !== 'rekap');
  document.getElementById('tabInput').classList.toggle('active', tab === 'input');
  document.getElementById('tabRekap').classList.toggle('active', tab === 'rekap');
}

function adjustCount(id, delta) {
  const inp = document.getElementById(id);
  const val = Math.max(0, (parseInt(inp.value) || 0) + delta);
  inp.value = val;
  document.getElementById('val' + id.charAt(0).toUpperCase() + id.slice(1)).textContent = val;
}

function tampilkanAlert(type, html) {
  const cls = type === 'success' ? 'alert-success' : type === 'warning' ? 'alert-warning' : 'alert-danger';
  document.getElementById('alertBox').innerHTML =
    `<div class="alert ${cls} py-2 px-3" style="border-radius:10px;font-size:13px;">${html}</div>`;
  window.scrollTo({top:0, behavior:'smooth'});
}

function handleFormSubmit(e) {
  e.preventDefault();
  if (currentUser && !currentUser.authorized) {
    tampilkanAlert('danger', '<i class="fa-solid fa-ban me-1"></i>' + (currentUser.message || 'Anda tidak berhak input.'));
    return;
  }
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  document.getElementById('btnSpinner').classList.remove('d-none');
  document.getElementById('btnText').textContent = 'Menyimpan...';

  const payload = {
    tanggal:  document.getElementById('tanggal').value,
    kelas:    document.getElementById('kelas').value,
    jamKe:    document.getElementById('jamKe').value,
    mapel:    document.getElementById('mapel').value,
    materi:   document.getElementById('materi').value,
    kegiatan: document.getElementById('kegiatan').value,
    hadir:    document.getElementById('hadir').value,
    sakit:    document.getElementById('sakit').value,
    izin:     document.getElementById('izin').value,
    alpa:     document.getElementById('alpa').value,
    catatan:  document.getElementById('catatan').value
  };

  google.script.run
    .withSuccessHandler(res => {
      btn.disabled = false;
      document.getElementById('btnSpinner').classList.add('d-none');
      document.getElementById('btnText').textContent = 'Simpan Jurnal';
      if (res.success) {
        playSuccessSound();
        tampilkanAlert('success', '<i class="fa-solid fa-circle-check me-1"></i>' + res.message);
        resetFormSetelahSimpan();
      } else {
        tampilkanAlert('danger', '<i class="fa-solid fa-triangle-exclamation me-1"></i>' + res.message);
      }
    })
    .withFailureHandler(err => {
      btn.disabled = false;
      document.getElementById('btnSpinner').classList.add('d-none');
      document.getElementById('btnText').textContent = 'Simpan Jurnal';
      tampilkanAlert('danger', '<i class="fa-solid fa-triangle-exclamation me-1"></i>Error: ' + err.message);
    })
    .simpanJurnal(payload);
}

function resetFormSetelahSimpan() {
  ['materi','kegiatan','catatan','jamKe'].forEach(id => document.getElementById(id).
